## REVIEW PROCESS

When invoked to review a component or page, run this checklist:

### Color Compliance

- [ ] No hardcoded hex / rgb / hsl in component `<style>` or inline `style`.
- [ ] All colors flow through Tailwind tokens backed by CSS vars.
- [ ] No `text-black` / `bg-white` / default Tailwind grays on user-visible surfaces.
- [ ] Location-themed pages rely on `useLocationTheme(slug)` + CSS vars, not hardcoded palettes.
- [ ] Dark theme is the base; light-on-white surfaces only for modals / input fields on focus.

### Typography Compliance

- [ ] Headlines / hero use `font-display` (Inter with appropriate weight).
- [ ] Body uses `font-body` (Inter).
- [ ] Hero headings use tight letter-spacing (`tracking-tight` or `-0.02em`).
- [ ] Secondary text uses `text-white/70` or similar opacity — not hardcoded grey.
- [ ] No pure black `#000000` on text.
- [ ] Heading hierarchy: one `<h1>` per page, then `<h2>` → `<h3>` without skipping.

### Layout & Spacing

- [ ] Base page background: `bg-dark`.
- [ ] Cards use `bg-surface` or `bg-white/5` for tonal separation.
- [ ] Card padding ≥ `p-6`.
- [ ] Border radius: `rounded-lg` for cards, `rounded-xl` for buttons. NO `rounded-none`.
- [ ] Vertical rhythm consistent with `space-y-*` utilities.

### Borders & Lines

- [ ] Dividers / borders use `border-white/10` or tonal shifts, not full-opacity colors.
- [ ] No grey `border-gray-*` classes on dark theme.
- [ ] Drop shadows, if any, use tinted primary/accent colors — no plain grey.

### Location Theming

- [ ] Page-level location pages call `useLocationTheme(slug)` via `useHead({ bodyAttrs })`.
- [ ] No direct DOM manipulation of `body[data-location]` in `onMounted`.
- [ ] Per-location colors come from CSS vars, not hardcoded class swaps.
- [ ] If adding a new location: CSS var block present in `app/assets/css/main.css` under the right mood section.

### Animations

- [ ] GSAP used through `useScrollAnimation()` composable (or an equivalent that uses `gsap.context()`).
- [ ] `ctx.revert()` called on `onBeforeUnmount`.
- [ ] Lenis usage lives in `app/plugins/lenis.client.ts`, not ad-hoc in components.
- [ ] `prefers-reduced-motion` respected.
- [ ] No animations on layout-trigger properties (width / top / left); only `transform` + `opacity`.

### Components

- [ ] Buttons: clear primary vs secondary vs ghost styles; primary uses solid token, not hardcoded color.
- [ ] Input fields: focused state uses token-based glow or accent, not default browser outline.
- [ ] Modals / overlays: glassmorphism acceptable with `backdrop-blur-*`.
- [ ] Icons: only `lucide-vue-next`, named imports.
- [ ] Images: `<NuxtImg>` with `width`/`height`, appropriate `sizes` and `loading` attributes.

### i18n & Content

- [ ] No hardcoded UI text — all user-visible strings use `t()` / `$t()`.
- [ ] Internal links use `localePath()` — no hardcoded `/it/...` prefixes.
- [ ] Text doesn't assume English sentence structure (keep layouts flexible to longer IT/FR/ES translations).

