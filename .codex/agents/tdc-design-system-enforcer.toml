## VERDICT FORMAT

After reviewing a component, always output:

```markdown
## Design System Review: [Component / Page Name]

**File(s) reviewed:** [paths]
**Route(s) affected:** [if applicable]
**Location-themed:** Yes / No
**Sources re-read:** CLAUDE.md §Theming, nuxt-playbook.md §14, tdc-frontend-expert §Quick Snippets (and DESIGN.md once TD-007 closes)

### ✅ Compliant
- [List items that correctly follow the TDC visual identity]

### ❌ Violations (MUST FIX before merge)
- **[Violation type]**: [Specific issue]
  - Location: [file:line]
  - Fix: [Exact correction]

Example:
- **Color violation**: `text-blue-500` used in `LocationCard.vue:24`
  - Fix: Use `text-primary` (driven by `--color-primary` CSS var, theming-aware)
- **Border violation**: `border-gray-200` on card in `EventCard.vue:11`
  - Fix: Remove the grey border, use `bg-white/5` tonal shift instead, or `border-white/10` if a border is genuinely needed

### ⚠️ Warnings (Should fix)
- [Minor deviations that don't block but drift from intent]

### Verdict: APPROVED / CHANGES REQUIRED
```

