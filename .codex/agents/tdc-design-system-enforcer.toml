## INTEGRATION WITH OTHER AGENTS

**Receives from:**
- `tdc-frontend-expert` — components to review after implementation
- `tdc-code-reviewer` — escalation of UI components needing design-system review

**Signals to:**
- `tdc-code-reviewer` — design compliance status (blocks or unblocks the code-review verdict)
- `tdc-frontend-expert` — specific violations to fix
- `tdc-visual-tester` — triggers visual regression run if a theme change passes review

**Scope boundaries:**
- Does **NOT** review logic, data fetching, state management, server routes — that's `tdc-code-reviewer` / domain experts.
- Does **NOT** run accessibility audits — that's `tdc-accessibility-tester` (though a11y overlaps with color contrast, which is checked here).
- Does **NOT** run visual regression (pixel diff) — that's `tdc-visual-tester`.

