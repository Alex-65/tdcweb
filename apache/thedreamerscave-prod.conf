# thedreamerscave.club -- production Apache vhost (Phase 6)
#
# Reverse proxy + TLS termination + static asset serving for the TDC
# Nuxt 4 + Flask 3 stack on mioh1 (Hetzner Frankfurt, Ubuntu).
#
# Architecture (per docs/superpowers/specs/2026-04-23-nuxt-integration-design.md
# and pdp-v3 sec 5):
#
#   Internet --> :443 Apache (this vhost)
#                  |
#                  +--> /_nuxt/, /assets   --> static disk (.output/public/)
#                  +--> /api/auth/**       --> :9501 Nuxt (BFF, sets HttpOnly
#                  |                            cookies, calls Flask via
#                  |                            flaskFetch)
#                  +--> /api/revalidate    --> :9501 Nuxt (admin-gated SSR
#                  |                            cache invalidation)
#                  +--> /api/**  (other)   --> :9500 Flask (locations, events,
#                  |                            artists, blog, future writes)
#                  +--> /trullo            --> :3600 (existing external service,
#                  |                            preserved from pre-Nuxt setup)
#                  +--> /                  --> :9501 Nuxt (SSR / SSG / SPA per
#                                              routeRules in nuxt.config.ts)
#
# Routing precedence: per-path Location/ProxyPass entries are evaluated in
# the order they appear in the vhost. /api/auth/ and /api/revalidate are
# declared BEFORE /api/ so they bind to Nuxt instead of falling through to
# Flask. Same split as dev mirrors prod.
#
# TLS:
#   - Cert: unified-cert at /etc/letsencrypt/live/unified-cert/ (16-domain
#     SAN cert covering thedreamerscave.club + www.thedreamerscave.club +
#     14 other TDC-family domains; auto-renewed by certbot systemd timer).
#   - Modern protocols only (TLS 1.2 + 1.3); SSLv2/3, TLSv1.0/1.1 disabled.
#   - Hardening pulled from /etc/letsencrypt/options-ssl-apache.conf.
#
# Required Apache modules (verify with `apache2ctl -M`):
#   proxy, proxy_http, headers, rewrite, ssl
#
# Deployment:
#   1. Stop the legacy static-content site:
#        sudo a2dissite 000-thedreamerscave thedreamerscave-ssl
#   2. Symlink this file:
#        sudo ln -s /data1/tdcweb/apache/thedreamerscave-prod.conf \
#                   /etc/apache2/sites-available/thedreamerscave-prod.conf
#        sudo a2ensite thedreamerscave-prod
#   3. Validate + reload:
#        sudo apache2ctl configtest
#        sudo systemctl reload apache2
#   See docs/deployment/production.md for the full runbook including the
#   build, systemd unit installation, and post-deploy smoke tests.

# ----------------------------------------------------------------------
# HTTP -> HTTPS redirect (with ACME challenge passthrough for renewals)
# ----------------------------------------------------------------------
<VirtualHost *:80>
    ServerName thedreamerscave.club
    ServerAlias www.thedreamerscave.club

    # Permit Let's Encrypt HTTP-01 challenge for cert renewals without
    # redirect. The unified-cert renewal hits a webroot path served from
    # /var/www/acme/.well-known/acme-challenge/.
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Require all granted
        Options None
        AllowOverride None
    </Directory>

    # Redirect everything else to HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/thedreamerscave-error.log
    CustomLog ${APACHE_LOG_DIR}/thedreamerscave-access.log combined
</VirtualHost>

# ----------------------------------------------------------------------
# HTTPS: TLS termination + Nuxt/Flask reverse proxy + static assets
# ----------------------------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName thedreamerscave.club
    ServerAlias www.thedreamerscave.club

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/unified-cert/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/unified-cert/privkey.pem
    Include                 /etc/letsencrypt/options-ssl-apache.conf

    # Security headers. CSP is intentionally permissive for v1 (Nuxt uses
    # inline event handlers in some auto-generated payload scripts; a strict
    # policy will land in a hardening pass once we measure the inline-script
    # surface). Frame/X-Content-Type lockdowns are safe to apply now.
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer-when-downgrade"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # ProxyPreserveHost ON: forward the original Host header so Flask and
    # Nuxt see thedreamerscave.club (needed by Nuxt's @nuxtjs/seo for
    # canonical URLs and by Flask logging).
    ProxyPreserveHost On
    # Pass real client IP. Trust only this Apache process; do not trust
    # X-Forwarded-* from arbitrary upstream.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}e"

    # ------------------------------------------------------------------
    # Static Nuxt assets: served directly from disk, never proxied.
    # The Nuxt build emits hashed filenames under .output/public/_nuxt/,
    # so they are cacheable indefinitely.
    # ------------------------------------------------------------------
    Alias /_nuxt/ /data1/tdcweb/frontend/.output/public/_nuxt/
    <Directory /data1/tdcweb/frontend/.output/public/_nuxt/>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Other static files emitted to /public (favicon, robots.txt, og images,
    # etc.). Apache serves them directly; Nuxt is the fallback.
    Alias /favicon.ico /data1/tdcweb/frontend/.output/public/favicon.ico
    <Files "favicon.ico">
        Require all granted
    </Files>

    # ------------------------------------------------------------------
    # BFF routes -- proxied to Nuxt (NOT Flask). MUST appear BEFORE the
    # /api/ catch-all so the more specific paths win.
    # ------------------------------------------------------------------

    # POST /api/revalidate (admin-gated SSR cache invalidation; Task 4.3).
    <Location /api/revalidate>
        ProxyPass        http://127.0.0.1:9501/api/revalidate
        ProxyPassReverse http://127.0.0.1:9501/api/revalidate
    </Location>

    # /api/auth/** (login, logout, refresh, me; Tasks 4.1-4.2). Nuxt sets
    # the HttpOnly cookies; without this Apache rule the requests would
    # fall through to Flask and the cookies would never be set on the
    # browser.
    <Location /api/auth/>
        ProxyPass        http://127.0.0.1:9501/api/auth/
        ProxyPassReverse http://127.0.0.1:9501/api/auth/
    </Location>

    # ------------------------------------------------------------------
    # Other /api/** -- proxied to Flask (locations, events, artists, blog,
    # health, future write endpoints). The trailing slash on the match
    # is critical: it scopes the rule so /api/auth/* (no trailing slash
    # match without it) does not accidentally hit this block.
    # ------------------------------------------------------------------
    <Location /api/>
        ProxyPass        http://127.0.0.1:9500/api/
        ProxyPassReverse http://127.0.0.1:9500/api/
        ProxyTimeout 60
    </Location>

    # ------------------------------------------------------------------
    # Legacy /trullo proxy (preserved from pre-Nuxt setup). External
    # service on :3600; not part of the TDC stack.
    # ------------------------------------------------------------------
    <Location /trullo>
        ProxyPass        http://127.0.0.1:3600/trullo
        ProxyPassReverse http://127.0.0.1:3600/trullo
        Require all granted
    </Location>

    # ------------------------------------------------------------------
    # Catch-all: everything else goes to Nuxt SSR (page rendering).
    # The trailing-slash form forwards / -> Nuxt / and preserves the path.
    # ------------------------------------------------------------------
    ProxyPass        / http://127.0.0.1:9501/
    ProxyPassReverse / http://127.0.0.1:9501/

    ErrorLog      ${APACHE_LOG_DIR}/thedreamerscave-ssl-error.log
    CustomLog     ${APACHE_LOG_DIR}/thedreamerscave-ssl-access.log combined
</VirtualHost>
</IfModule>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
